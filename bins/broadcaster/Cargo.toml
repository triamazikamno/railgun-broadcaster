[package]
name = "railgun-broadcaster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { version = "0.9" }
structopt = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "parking_lot"] }
tracing-logfmt = { version = "0.3" }
axum = { workspace = true }

config = { path = "../../crates/config" }
broadcaster-core = { path = "../../crates/core" }
poi = { path = "../../crates/poi" }
fees = { path = "../../crates/fees" }
waku-relay = { path = "../../crates/waku-relay" }
waku = { path = "../../crates/waku" }
broadcaster-service = { path = "../../crates/service" }
railgun-wallet = { path = "../../crates/railgun-wallet" }
sync-service = { path = "../../crates/sync-service" }
local-db = { path = "../../crates/local-db" }
merkletree = { path = "../../crates/merkletree" }
